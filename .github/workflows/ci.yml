name: quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 2,5'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-ci
        with:
          install-buf: "true"
          install-govulncheck: "true"
      - name: Install pinned golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-only: true
      - name: Run Go quality gates
        run: make ci-go
      - name: Install pinned AWS SAM CLI
        run: pipx install aws-sam-cli==1.145.2
      - name: Validate the M4 and M5 SAM/CloudFormation graphs
        run: make ci-iac

  web-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.UI_SUBMODULE_READ_TOKEN }}
      - uses: ./.github/actions/setup-ui-ci
      - name: Build, lint, and type-check UI
        run: make ci-ui
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Restore Trivy vulnerability database cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-0.69.2
      - name: Scan repository, Dockerfile, and service images
        run: make ci-security

  integration:
    runs-on: ubuntu-latest
    env:
      CI_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci.yml
      TEST_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci.yml
      INTEGRATION_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/bootstrap-local-stack-ci
      - name: Run Retrieval and Answer contract suites
        run: make ci-contract
      - name: Validate and start the local stack
        run: |
          make compose-config
          bash ./scripts/ci-compose.sh config --quiet
          POSTGRES_PORT=5432 MINIO_API_PORT=9000 RABBITMQ_AMQP_PORT=5672 EDGE_RETRIEVAL_READINESS_REQUIRED=true \
            bash ./scripts/ci-compose.sh up -d --build --wait --wait-timeout 300
      - name: Configure host-side integration clients
        run: bash ./scripts/configure-ci-host-clients.sh
      - name: Show TEI startup diagnostics
        if: failure()
        run: |
          docker inspect --format 'exit={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{.State.Error}} memory_bytes={{.HostConfig.Memory}} nano_cpus={{.HostConfig.NanoCPUs}}' raglibrarian-text-embeddings-inference-1 || true
          bash ./scripts/ci-compose.sh logs --no-color --tail=200 text-embeddings-inference || true
      - name: Run live mTLS service contracts
        run: make m4-contract-test
      - name: Verify MinIO multipart cleanup
        run: make minio-runtime-test
      - name: Run black-box and controlled worker-recovery tests
        run: |
          E2E_BOOTSTRAP_CODE="$(cat .dev/secrets/e2e_bootstrap_code)" \
          E2E_MAIL_FIXTURE_URL=http://127.0.0.1:8025/view/latest.txt \
            make m4-m5-m6-integration-test
      - name: Show integration diagnostics
        if: failure()
        run: |
          bash ./scripts/ci-compose.sh logs --no-color --tail=300 ingestion-service retrieval-worker retrieval-service answer-service llm-provider-stub rabbitmq qdrant || true
      - name: Run focused M5 worker-recovery tests
        run: make m5-worker-recovery-test
      - name: Verify database-loss readiness behavior
        run: |
          bash ./scripts/ci-compose.sh stop postgres
          for attempt in $(seq 1 30); do
            ready_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/readyz)
            live_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/healthz)
            if [ "$ready_status" = "503" ] && [ "$live_status" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Show container state
        if: failure()
        run: bash ./scripts/ci-compose.sh ps --all
      - name: Tear down stack
        if: always()
        run: bash ./scripts/ci-compose.sh down -v

  m4-performance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci.yml
      TEST_COMPOSE_FILES: -f docker-compose.yml -f docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/bootstrap-local-stack-ci
      - name: Start isolated M4 stack
        run: bash ./scripts/ci-compose.sh up -d --build --wait --wait-timeout 240
      - name: Run M4 performance smoke and soak suites
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_SECONDARY_BASE_URL: http://127.0.0.1:8081
          E2E_MAIL_FIXTURE_URL: http://127.0.0.1:8025/view/latest.txt
          M4_PERFORMANCE_PROFILE: m4-slo-v1
          M4_SOAK_DURATION: 30m
        run: |
          token_dir="$(mktemp -d /tmp/raglibrarian-m4-tokens.XXXXXX)"
          chmod 700 "$token_dir"
          trap 'rm -f "$token_dir/access" "$token_dir/refresh" "$token_dir/revocable"; rmdir "$token_dir"' EXIT
          E2E_BOOTSTRAP_CODE="$(cat .dev/secrets/e2e_bootstrap_code)" \
          E2E_M4_ACCESS_TOKEN_OUT="$token_dir/access" \
          E2E_M4_REFRESH_COOKIE_OUT="$token_dir/refresh" \
          E2E_M4_REVOCABLE_TOKEN_OUT="$token_dir/revocable" \
          E2E_MAIL_FIXTURE_URL=http://127.0.0.1:8025/view/latest.txt make e2e
          M4_E2E_ACCESS_TOKEN_FILE="$token_dir/access" make m4-performance-smoke
          M4_E2E_ACCESS_TOKEN_FILE="$token_dir/access" \
          M4_E2E_REFRESH_COOKIE_FILE="$token_dir/refresh" make m4-soak
      - name: Show container state and logs
        if: failure()
        run: bash ./scripts/ci-compose.sh ps --all
      - name: Tear down stack
        if: always()
        run: bash ./scripts/ci-compose.sh down -v
