name: Bootstrap local stack CI
description: Install pinned Go CI tools and create ephemeral local test configuration.

inputs:
  install-buf:
    description: Install buf for proto lint and breaking checks.
    required: false
    default: "false"
  install-govulncheck:
    description: Install govulncheck for vulnerability scanning.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-go-ci
      with:
        install-buf: ${{ inputs.install-buf }}
        install-govulncheck: ${{ inputs.install-govulncheck }}

    - name: Create ephemeral file-backed local configuration
      shell: bash
      run: make ci-bootstrap-local-config
