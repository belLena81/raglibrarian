vulnerabilities:
  - id: GHSA-5p4m-2wfm-xmqj
    purls:
      - pkg:npm/js-yaml@4.3.0
    expired_at: 2026-08-20
    statement: >-
      The official qdrant/qdrant:v1.19.0 image bundles js-yaml 4.3.0 in
      Qdrant's upstream web UI. Qdrant is API-key protected and is not exposed
      publicly by the cloud profile, which limits UI parsing exposure. Remove
      this exception when the official image bundles js-yaml 4.3.1 or later,
      or removes the affected UI dependency.
  - id: CVE-2026-67213
    purls:
      - pkg:npm/nanoid@3.3.16
      - pkg:npm/nanoid@5.1.5
    expired_at: 2026-08-20
    statement: >-
      The official qdrant/qdrant:v1.19.0 image bundles both nanoid versions in
      Qdrant's upstream web UI. Qdrant is API-key protected and is not exposed
      publicly by the cloud profile, which limits attacker-controlled UI input.
      Remove this exception when the official image bundles nanoid 3.3.17 or
      later and 5.1.6 or later, or removes the affected UI dependencies.
  - id: CVE-2026-67214
    purls:
      - pkg:npm/nanoid@5.1.5
    expired_at: 2026-08-20
    statement: >-
      The official qdrant/qdrant:v1.19.0 image bundles nanoid 5.1.5 in Qdrant's
      upstream web UI. Qdrant is API-key protected and is not exposed publicly
      by the cloud profile, which limits attacker-controlled UI input. Remove
      this exception when the official image bundles nanoid 5.1.16 or later,
      or removes the affected UI dependency.
