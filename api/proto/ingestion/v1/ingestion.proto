syntax = "proto3";

package ingestion.v1;

option go_package = "github.com/belLena81/raglibrarian/pkg/proto/ingestion/v1;ingestionv1";

import "google/protobuf/timestamp.proto";

enum BookProcessingFailureCategory {
  BOOK_PROCESSING_FAILURE_CATEGORY_UNSPECIFIED = 0;
  BOOK_PROCESSING_FAILURE_CATEGORY_ENCRYPTED_DOCUMENT = 1;
  BOOK_PROCESSING_FAILURE_CATEGORY_EXTRACTION_NOT_PERMITTED = 2;
  BOOK_PROCESSING_FAILURE_CATEGORY_MALFORMED_DOCUMENT = 3;
  BOOK_PROCESSING_FAILURE_CATEGORY_UNSUPPORTED_DOCUMENT = 4;
  BOOK_PROCESSING_FAILURE_CATEGORY_NO_EXTRACTABLE_TEXT = 5;
  BOOK_PROCESSING_FAILURE_CATEGORY_RESOURCE_LIMIT_EXCEEDED = 6;
  BOOK_PROCESSING_FAILURE_CATEGORY_SOURCE_INTEGRITY_MISMATCH = 7;
  BOOK_PROCESSING_FAILURE_CATEGORY_PROCESSING_TIMEOUT = 8;
  BOOK_PROCESSING_FAILURE_CATEGORY_DEPENDENCY_UNAVAILABLE = 9;
  BOOK_PROCESSING_FAILURE_CATEGORY_INTERNAL_PROCESSING_ERROR = 10;
}

enum ContentSelectionMode {
  CONTENT_SELECTION_MODE_UNSPECIFIED = 0;
  CONTENT_SELECTION_MODE_DISABLED = 1;
  CONTENT_SELECTION_MODE_OBSERVATION = 2;
  CONTENT_SELECTION_MODE_ENFORCEMENT = 3;
}

enum ContentExclusionReason {
  CONTENT_EXCLUSION_REASON_UNSPECIFIED = 0;
  CONTENT_EXCLUSION_REASON_TITLE_PAGE = 1;
  CONTENT_EXCLUSION_REASON_COPYRIGHT_OR_IMPRINT = 2;
  CONTENT_EXCLUSION_REASON_DEDICATION_OR_ORNAMENTAL_BLANK = 3;
  CONTENT_EXCLUSION_REASON_TABLE_OR_LIST = 4;
  CONTENT_EXCLUSION_REASON_INDEX = 5;
  CONTENT_EXCLUSION_REASON_PUBLISHER_CATALOG_OR_ADVERTISING = 6;
  CONTENT_EXCLUSION_REASON_ALSO_BY = 7;
  CONTENT_EXCLUSION_REASON_COLOPHON = 8;
}

enum ContentSelectionFallbackReason {
  CONTENT_SELECTION_FALLBACK_REASON_UNSPECIFIED = 0;
  CONTENT_SELECTION_FALLBACK_REASON_NONE = 1;
  CONTENT_SELECTION_FALLBACK_REASON_DISABLED = 2;
  CONTENT_SELECTION_FALLBACK_REASON_OBSERVATION = 3;
  CONTENT_SELECTION_FALLBACK_REASON_UNSUPPORTED_LAYOUT = 4;
  CONTENT_SELECTION_FALLBACK_REASON_PROCESSING_TIMEOUT = 5;
  CONTENT_SELECTION_FALLBACK_REASON_INVALID_OUTPUT = 6;
  CONTENT_SELECTION_FALLBACK_REASON_AMBIGUOUS_MAPPING = 7;
  CONTENT_SELECTION_FALLBACK_REASON_RESOURCE_LIMIT = 8;
  CONTENT_SELECTION_FALLBACK_REASON_EXCESSIVE_EXCLUSION = 9;
  CONTENT_SELECTION_FALLBACK_REASON_INTERNAL_ERROR = 10;
}

message ExcludedRangeV1 {
  // Ordinals are one-based and inclusive in the original PDF page or EPUB spine order.
  uint32 start_ordinal = 1;
  uint32 end_ordinal = 2;
  ContentExclusionReason reason = 3;
}

message BookContentSelectionRequestedV1 {
  string event_id = 1;
  // Equal to event_id in v1; completion events use it as the durable request correlation key.
  string request_id = 2;
  string book_id = 3;
  string source_reference = 4;
  string media_type = 5;
  bytes source_sha256 = 6;
  int64 source_byte_size = 7;
  int64 lifecycle_version = 8;
  bytes processing_profile_digest = 9;
  ContentSelectionMode mode = 10;
  string selector_version = 11;
  string parser_profile = 12;
  string correlation_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  string causation_id = 15;
  string producer = 16;
  string schema_version = 17;
  string idempotency_key = 18;
  string job_id = 19;
  bytes policy_digest = 20;
}

message BookContentSelectionCompletedV1 {
  string event_id = 1;
  string request_id = 2;
  string book_id = 3;
  bytes source_sha256 = 4;
  int64 lifecycle_version = 5;
  bytes processing_profile_digest = 6;
  uint32 original_ordinal_count = 7;
  ContentSelectionMode mode = 8;
  string selector_version = 9;
  string parser_version = 10;
  bytes model_digest = 11;
  bytes policy_digest = 12;
  ContentSelectionFallbackReason fallback_reason = 13;
  repeated ExcludedRangeV1 excluded_ranges = 14;
  string correlation_id = 15;
  google.protobuf.Timestamp occurred_at = 16;
  string causation_id = 17;
  string producer = 18;
  string schema_version = 19;
  string idempotency_key = 20;
  string job_id = 21;
  string media_type = 22;
}

message BookProcessingStartedV1 {
  string event_id = 1;
  string book_id = 2;
  bytes source_sha256 = 3;
  string extraction_version = 4;
  string normalization_version = 5;
  string tokenizer_version = 6;
  string chunking_version = 7;
  string correlation_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
  string causation_id = 10;
  string producer = 11;
  string schema_version = 12;
  string idempotency_key = 13;
  int64 lifecycle_version = 14;
}

message BookChunksReadyV1 {
  string event_id = 1;
  string book_id = 2;
  bytes source_sha256 = 3;
  string manifest_reference = 4;
  bytes manifest_sha256 = 5;
  int64 manifest_byte_size = 6;
  uint32 page_count = 7;
  uint32 chunk_count = 8;
  string extraction_version = 9;
  string normalization_version = 10;
  string tokenizer_version = 11;
  string chunking_version = 12;
  string correlation_id = 13;
  google.protobuf.Timestamp occurred_at = 14;
  string causation_id = 15;
  string producer = 16;
  string schema_version = 17;
  string idempotency_key = 18;
  string structure_version = 19;
  uint32 maximum_tokens = 20;
  uint32 overlap_tokens = 21;
  int64 lifecycle_version = 22;
}

message BookProcessingFailedV1 {
  string event_id = 1;
  string book_id = 2;
  bytes source_sha256 = 3;
  string extraction_version = 4;
  string normalization_version = 5;
  string tokenizer_version = 6;
  string chunking_version = 7;
  BookProcessingFailureCategory failure_category = 8;
  string correlation_id = 9;
  google.protobuf.Timestamp occurred_at = 10;
  string causation_id = 11;
  string producer = 12;
  string schema_version = 13;
  string idempotency_key = 14;
  int64 lifecycle_version = 15;
  string failure_detail = 16;
}

message ChunkV1 {
  string chunk_id = 1;
  string book_id = 2;
  uint64 order = 3;
  string text = 4;
  bytes content_sha256 = 5;
  string chapter = 6;
  string section = 7;
  uint32 page_start = 8;
  uint32 page_end = 9;
  uint64 token_start = 10;
  uint64 token_end = 11;
  string extraction_version = 12;
  string normalization_version = 13;
  string tokenizer_version = 14;
  string chunking_version = 15;
  string structure_version = 16;
}

message ChunkShardDescriptorV1 {
  string reference = 1;
  bytes sha256 = 2;
  int64 compressed_byte_size = 3;
  int64 uncompressed_byte_size = 4;
  uint32 chunk_count = 5;
  uint64 first_chunk_order = 6;
  uint64 last_chunk_order = 7;
}

message ContentSelectionV1 {
  ContentSelectionMode mode = 1;
  string selector_version = 2;
  string parser_version = 3;
  bytes model_digest = 4;
  bytes policy_digest = 5;
  ContentSelectionFallbackReason fallback_reason = 6;
  uint32 original_ordinal_count = 7;
  uint32 retained_ordinal_count = 8;
  uint32 excluded_ordinal_count = 9;
  double excluded_ratio = 10;
  repeated ExcludedRangeV1 excluded_ranges = 11;
  bytes processing_profile_digest = 12;
}

message ChunkManifestV1 {
  string schema_version = 1;
  string book_id = 2;
  bytes source_sha256 = 3;
  bytes processing_config_digest = 4;
  string extraction_version = 5;
  string normalization_version = 6;
  string tokenizer_version = 7;
  string chunking_version = 8;
  uint32 page_count = 9;
  uint32 chunk_count = 10;
  google.protobuf.Timestamp generated_at = 11;
  repeated ChunkShardDescriptorV1 shards = 12;
  string structure_version = 13;
  uint32 maximum_tokens = 14;
  uint32 overlap_tokens = 15;
  int64 lifecycle_version = 16;
  ContentSelectionV1 content_selection = 17;
}

message BookArtifactsDeletedV1 {
  string event_id = 1;
  string book_id = 2;
  string command_id = 3;
  int64 lifecycle_version = 4;
  string correlation_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string causation_id = 7;
  string producer = 8;
  string schema_version = 9;
  string idempotency_key = 10;
}
